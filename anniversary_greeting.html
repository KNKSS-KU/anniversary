<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ส่งคำอวยพร</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Sarabun:wght@300;400;500;600&family=Cormorant+Garamond:ital,wght@0,300;1,300&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --o:#FF8200;--od:#CC6800;--ol:#FFF3E0;
  --g:#3DAA6B;
  --gray1:#74787B;--gray2:#222221;--gray3:#f7f5f2;
  --serif:'Cormorant Garamond',serif;
  --disp:'Cinzel',serif;--thai:'Sarabun',sans-serif;
  --border:0.5px solid rgba(0,0,0,.1);
}
html,body{min-height:100%;background:#EDE8E1;font-family:var(--thai);color:var(--gray2)}

/* ── BG ORNAMENT ── */
body::before{
  content:'✦';position:fixed;font-size:320px;
  color:rgba(255,130,0,.04);top:-60px;right:-60px;
  font-family:serif;pointer-events:none;z-index:0;
  line-height:1;
}

/* ── HEADER ── */
.g-header{
  background:rgba(255,255,255,.95);backdrop-filter:blur(10px);
  border-bottom:var(--border);
  padding:0 20px;height:52px;
  display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:50;
}
.h-brand{font-family:var(--disp);font-size:14px;letter-spacing:.08em}
.h-back{font-size:12px;color:var(--gray1);text-decoration:none;
  display:flex;align-items:center;gap:4px;padding:5px 10px;
  border-radius:100px;border:var(--border);transition:all .2s}
.h-back:hover{background:var(--gray3)}

/* ── MAIN ── */
.g-main{
  max-width:560px;margin:0 auto;padding:32px 16px 60px;
  position:relative;z-index:1;
}

/* ── HERO ── */
.g-hero{text-align:center;margin-bottom:28px}
.g-hero-icon{font-size:32px;margin-bottom:10px;opacity:.7}
.g-hero-title{font-family:var(--disp);font-size:22px;letter-spacing:.06em;color:var(--gray2);margin-bottom:6px}
.g-hero-sub{font-family:var(--serif);font-style:italic;font-size:16px;color:var(--gray1)}

/* ── CARD PREVIEW ── */
.card-preview{
  background:#fff;border-radius:16px;border:var(--border);
  padding:24px;margin-bottom:24px;
  display:flex;flex-direction:column;gap:12px;
  min-height:120px;transition:all .3s;
  box-shadow:0 4px 20px rgba(0,0,0,.04);
}
.preview-msg{
  font-family:var(--serif);font-size:18px;line-height:1.75;
  color:var(--gray2);flex:1;
}
.preview-msg.placeholder{color:rgba(116,120,123,.4);font-style:italic}
.preview-footer{display:flex;align-items:center;gap:10px}
.preview-av{
  width:32px;height:32px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:700;color:#fff;
  background:var(--o);transition:background .3s;
}
.preview-name{font-size:13px;font-weight:500;color:var(--gray2)}
.preview-time{font-size:11px;color:var(--gray1);margin-left:auto}

/* ── FORM CARD ── */
.form-card{background:#fff;border-radius:16px;border:var(--border);overflow:hidden;
  box-shadow:0 4px 20px rgba(0,0,0,.04)}
.form-section{padding:20px}
.form-section+.form-section{border-top:var(--border)}
.form-label{font-size:12px;font-weight:500;color:var(--gray1);margin-bottom:6px;display:block}
.form-section label{font-size:12px;font-weight:500;color:var(--gray1);margin-bottom:6px;display:block}
input[type=text], textarea{
  font-family:var(--thai);font-size:14px;
  width:100%;padding:10px 14px;
  border:var(--border);border-radius:10px;background:#fafaf9;color:var(--gray2);
  outline:none;transition:border-color .2s,background .2s;resize:none;
}
input[type=text]:focus, textarea:focus{
  border-color:var(--o);background:#fff;
}
textarea{line-height:1.65;min-height:120px}

/* ── PRESETS ── */
.preset-title{font-size:12px;font-weight:500;color:var(--gray1);margin-bottom:8px}
.preset-list{display:flex;flex-direction:column;gap:6px}
.preset-item{
  font-family:var(--serif);font-size:14px;line-height:1.55;
  padding:10px 14px;border-radius:10px;border:var(--border);
  background:#fafaf9;cursor:pointer;color:var(--gray2);
  transition:all .2s;text-align:left;width:100%;
}
.preset-item:hover{border-color:var(--o);background:var(--ol)}
.preset-item.selected{border-color:var(--o);background:var(--ol);color:var(--od)}

/* ── CHAR COUNT ── */
.char-row{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.char-count{font-size:11px;color:var(--gray1)}
.char-count.warn{color:#e53935}

/* ── SUBMIT ── */
.submit-section{padding:16px 20px;background:var(--gray3);border-top:var(--border)}
.btn-submit{
  width:100%;font-family:var(--disp);font-size:13px;letter-spacing:.1em;
  padding:14px;border:none;border-radius:12px;
  background:var(--o);color:#fff;cursor:pointer;
  transition:all .25s;display:flex;align-items:center;justify-content:center;gap:8px;
}
.btn-submit:hover:not(:disabled){background:var(--od);transform:translateY(-1px);box-shadow:0 4px 16px rgba(255,130,0,.3)}
.btn-submit:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn-submit .spin{width:16px;height:16px;border:2px solid rgba(255,255,255,.4);
  border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;display:none}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── STATUS ── */
.status-box{
  margin-top:12px;padding:10px 14px;border-radius:10px;
  font-size:13px;display:none;align-items:center;gap:8px;
}
.status-box.ok{background:#e8f5e9;color:#1b5e20;border:0.5px solid #a5d6a7;display:flex}
.status-box.err{background:#ffebee;color:#b71c1c;border:0.5px solid #ef9a9a;display:flex}
.status-box.loading{background:#fff8e1;color:#7c6000;border:0.5px solid #ffe082;display:flex}

/* ── SUCCESS OVERLAY ── */
.success-wrap{
  position:fixed;inset:0;background:#EDE8E1;z-index:200;
  display:none;flex-direction:column;align-items:center;justify-content:center;
  gap:16px;text-align:center;padding:20px;
}
.success-wrap.show{display:flex}
.success-icon{font-size:56px;animation:popIn .4s ease}
.success-title{font-family:var(--disp);font-size:24px;letter-spacing:.06em}
.success-sub{font-family:var(--serif);font-style:italic;font-size:16px;color:var(--gray1)}
.success-card{
  background:#fff;border-radius:16px;border:var(--border);
  padding:20px 24px;max-width:400px;width:100%;text-align:left;
  box-shadow:0 4px 20px rgba(0,0,0,.06);
}
.success-card .msg{font-family:var(--serif);font-size:16px;line-height:1.75;color:var(--gray2)}
.success-card .from{font-size:13px;color:var(--gray1);margin-top:10px}
.success-btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.btn-wall{
  font-family:var(--thai);font-size:13px;padding:10px 20px;border-radius:100px;
  background:var(--o);color:#fff;border:none;cursor:pointer;text-decoration:none;
  transition:all .2s;
}
.btn-wall:hover{background:var(--od)}
.btn-again{
  font-family:var(--thai);font-size:13px;padding:10px 20px;border-radius:100px;
  background:transparent;color:var(--gray1);border:var(--border);cursor:pointer;
  text-decoration:none;transition:all .2s;
}
.btn-again:hover{background:var(--gray3)}
@keyframes popIn{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}

/* ── NC STATUS (ถ้าไม่มี session) ── */
.nc-warn{
  background:#fff8e1;border:0.5px solid #ffe082;border-radius:10px;
  padding:10px 14px;font-size:12px;color:#7c6000;margin-bottom:16px;
  display:none;
}
.nc-warn a{color:var(--o);font-weight:500}

@media(max-width:400px){
  .g-hero-title{font-size:18px}
}
</style>
</head>
<body>

<!-- HEADER -->
<div class="g-header">
  <div class="h-brand">ANNIVERSARY</div>
  <a class="h-back" href="anniversary-wall.html">← ดู Wall</a>
</div>

<!-- MAIN -->
<div class="g-main">

  <!-- HERO -->
  <div class="g-hero">
    <div class="g-hero-icon">✦</div>
    <div class="g-hero-title" id="heroTitle">ส่งคำอวยพร</div>
    <div class="g-hero-sub" id="heroSub">ร่วมอวยพรในโอกาสพิเศษนี้</div>
  </div>

  <!-- NC WARN -->
  <div class="nc-warn" id="ncWarn">
    ⚠ ยังไม่ได้ตั้งค่า App Password — กรุณาไปที่ <a href="admin.html">admin.html</a> ก่อน
  </div>

  <!-- CARD PREVIEW -->
  <div class="card-preview" id="cardPreview">
    <div class="preview-msg placeholder" id="previewMsg">ข้อความของคุณจะแสดงที่นี่...</div>
    <div class="preview-footer">
      <div class="preview-av" id="previewAv">?</div>
      <div class="preview-name" id="previewName">ชื่อของคุณ</div>
      <div class="preview-time" id="previewTime"></div>
    </div>
  </div>

  <!-- FORM -->
  <div class="form-card">

    <!-- NAME -->
    <div class="form-section">
      <label for="fName">ชื่อของคุณ <span style="color:var(--o)">*</span></label>
      <input type="text" id="fName" placeholder="กรอกชื่อที่ต้องการแสดงบนการ์ด" maxlength="60" oninput="updatePreview()">
    </div>

    <!-- MESSAGE -->
    <div class="form-section">
      <label for="fMsg">ข้อความอวยพร <span style="color:var(--o)">*</span></label>
      <textarea id="fMsg" placeholder="เขียนคำอวยพรจากใจ..." maxlength="400" oninput="updatePreview()"></textarea>
      <div class="char-row">
        <span></span>
        <span class="char-count" id="charCount">0 / 400</span>
      </div>
    </div>

    <!-- PRESETS -->
    <div class="form-section" id="presetSection" style="display:none">
      <div class="preset-title">หรือเลือกข้อความสำเร็จรูป</div>
      <div class="preset-list" id="presetList"></div>
    </div>

    <!-- SUBMIT -->
    <div class="submit-section">
      <button class="btn-submit" id="btnSubmit" onclick="submitGreeting()" disabled>
        <span class="spin" id="submitSpin"></span>
        <span id="btnLabel">SEND GREETING ✦</span>
      </button>
      <div class="status-box" id="statusBox"></div>
    </div>

  </div>
</div>

<!-- SUCCESS OVERLAY -->
<div class="success-wrap" id="successWrap">
  <div class="success-icon">✦</div>
  <div class="success-title">ส่งสำเร็จแล้ว!</div>
  <div class="success-sub" id="successSub">ขอบคุณสำหรับคำอวยพร</div>
  <div class="success-card">
    <div class="msg" id="successMsg"></div>
    <div class="from" id="successFrom"></div>
  </div>
  <div class="success-btns">
    <a class="btn-wall" href="anniversary-wall.html">🖼 ดูบน Wall</a>
    <button class="btn-again" onclick="resetForm()">✎ ส่งอีกครั้ง</button>
  </div>
</div>

<script>
/* ================================================================
   KU Drive WebDAV
   ================================================================ */
const NC = {
  base:   'https://kudrive.ku.ac.th',
  user:   'feconkos',
  folder: 'anniversary',
  get pass(){ return sessionStorage.getItem('nc_pass') || '' },
  get dav(){ return `${this.base}/remote.php/dav/files/${this.user}/${this.folder}` },
  get headers(){
    return {
      'Authorization': 'Basic ' + btoa(`${this.user}:${this.pass}`),
      'Content-Type': 'application/json'
    };
  },
  async getJSON(file){
    const r = await fetch(`${this.dav}/${file}`, { headers: this.headers });
    if(r.status===404) return null;
    if(!r.ok) throw new Error(`${r.status}`);
    return r.json();
  },
  async putJSON(file, data){
    const r = await fetch(`${this.dav}/${file}`, {
      method:'PUT', headers: this.headers,
      body: JSON.stringify(data, null, 2)
    });
    if(!r.ok) throw new Error(`${r.status} ${r.statusText}`);
    return true;
  }
};

/* ── Helpers ── */
const COLORS=['#FF8200','#3DAA6B','#C0715A','#5B7FA6','#8A6FB5','#D4845A'];
function colorFor(n){ let h=0; for(let c of n) h=(h<<5)-h+c.charCodeAt(0); return COLORS[Math.abs(h)%COLORS.length]; }
function initials(n){ return n.trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase()||'?'; }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }

function setStatus(type, msg){
  const el=document.getElementById('statusBox');
  el.className='status-box '+type;
  el.innerHTML=(type==='loading'?'<div style="width:12px;height:12px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:spin .6s linear infinite;flex-shrink:0"></div>':'')+'<span>'+msg+'</span>';
}

/* ── Preview ── */
function updatePreview(){
  const name = document.getElementById('fName').value.trim();
  const msg  = document.getElementById('fMsg').value.trim();
  const len  = document.getElementById('fMsg').value.length;

  // preview message
  const pm = document.getElementById('previewMsg');
  if(msg){ pm.textContent=msg; pm.classList.remove('placeholder'); }
  else { pm.textContent='ข้อความของคุณจะแสดงที่นี่...'; pm.classList.add('placeholder'); }

  // preview name + avatar
  const av  = document.getElementById('previewAv');
  const pn  = document.getElementById('previewName');
  if(name){
    av.textContent=initials(name); av.style.background=colorFor(name);
    pn.textContent=name;
  } else {
    av.textContent='?'; av.style.background='#ccc'; pn.textContent='ชื่อของคุณ';
  }

  // preview time
  document.getElementById('previewTime').textContent = new Date().toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'});

  // char count
  const cc=document.getElementById('charCount');
  cc.textContent=`${len} / 400`;
  cc.classList.toggle('warn', len>350);

  // submit button
  document.getElementById('btnSubmit').disabled = !(name && msg);
}

/* ── Load config & presets ── */
async function init(){
  // check pass
  if(!NC.pass){
    document.getElementById('ncWarn').style.display='block';
  }
  try{
    const cfg = await NC.getJSON('config.json');
    if(cfg){
      if(cfg.orgName) document.getElementById('heroSub').textContent=`ร่วมอวยพรในโอกาสครบรอบ ${cfg.year} ปี ของ${cfg.orgName}`;
      if(cfg.year) document.getElementById('heroTitle').textContent=`ส่งคำอวยพร — ${cfg.year} ปี`;
      if(cfg.presets && cfg.presets.length){
        const sec=document.getElementById('presetSection');
        const list=document.getElementById('presetList');
        sec.style.display='block';
        cfg.presets.forEach(p=>{
          const btn=document.createElement('button');
          btn.className='preset-item';
          btn.textContent=p;
          btn.onclick=()=>{
            document.querySelectorAll('.preset-item').forEach(b=>b.classList.remove('selected'));
            btn.classList.add('selected');
            document.getElementById('fMsg').value=p;
            updatePreview();
          };
          list.appendChild(btn);
        });
      }
    }
  }catch(_){}
  updatePreview();
}

/* ── Submit ── */
async function submitGreeting(){
  const name = document.getElementById('fName').value.trim();
  const msg  = document.getElementById('fMsg').value.trim();
  if(!name||!msg) return;
  if(!NC.pass){
    setStatus('err','กรุณาตั้งค่า App Password ใน admin.html ก่อน');
    return;
  }

  document.getElementById('btnSubmit').disabled=true;
  document.getElementById('submitSpin').style.display='block';
  document.getElementById('btnLabel').textContent='กำลังส่ง...';
  setStatus('loading','กำลังบันทึกลง KU Drive...');

  try{
    // โหลด greetings ปัจจุบัน
    let list = await NC.getJSON('greetings.json');
    if(!Array.isArray(list)) list=[];

    const entry = {
      id: uid(),
      name: name,
      message: msg,
      time: new Date().toISOString()
    };
    list.push(entry);
    await NC.putJSON('greetings.json', list);

    // แสดง success
    document.getElementById('successMsg').textContent=msg;
    document.getElementById('successFrom').textContent='— '+name;
    document.getElementById('successWrap').classList.add('show');

  } catch(e){
    setStatus('err','❌ ส่งไม่สำเร็จ: '+e.message+' — ตรวจสอบ App Password ใน admin.html');
    document.getElementById('btnSubmit').disabled=false;
    document.getElementById('submitSpin').style.display='none';
    document.getElementById('btnLabel').textContent='SEND GREETING ✦';
  }
}

/* ── Reset ── */
function resetForm(){
  document.getElementById('successWrap').classList.remove('show');
  document.getElementById('fName').value='';
  document.getElementById('fMsg').value='';
  document.querySelectorAll('.preset-item').forEach(b=>b.classList.remove('selected'));
  document.getElementById('btnSubmit').disabled=true;
  document.getElementById('submitSpin').style.display='none';
  document.getElementById('btnLabel').textContent='SEND GREETING ✦';
  document.getElementById('statusBox').className='status-box';
  updatePreview();
}

/* ── Init ── */
init();
</script>
</body>
</html>
